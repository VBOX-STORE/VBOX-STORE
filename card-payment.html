<!DOCTYPE html>
<html>

<head>
<title>VBOX Card Payment</title>

<style>

body{
    font-family: Arial, sans-serif;
    padding:20px;
    background:#f5f5f5;
}


.container{
    background:white;
    padding:25px;
    border-radius:15px;
    max-width:450px;
    margin:auto;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}


h1{
    text-align:center;
}


.amount{
    font-size:30px;
    font-weight:bold;
    color:#111;
    text-align:center;
}


.card-box{
    background:#111;
    color:white;
    padding:20px;
    border-radius:15px;
    margin:20px 0;
}


input{
    width:100%;
    padding:15px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
    box-sizing:border-box;
}


button{

    width:100%;
    padding:15px;
    background:black;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;

}


button:hover{
    opacity:0.8;
}


</style>

</head>


<body>


<div class="container">


<h1>VBOX Card Payment</h1>


<h2>Complete Your Payment</h2>


<p>Order Total:</p>


<div class="amount" id="cardTotal">
    €0
</div>



<div class="card-box">

<h3>💳 Card Payment</h3>

<p>Secure checkout</p>

</div>



<h3>Card Details</h3>


<input type="text" id="cardName" placeholder="Card Holder Name">


<input type="text" id="cardNumber" placeholder="Card Number">


<input type="text" id="expiry" placeholder="MM/YY">


<input type="password" id="cvv" placeholder="CVV">


<button onclick="completeCardPayment()">

Pay Now

</button>


</div>


<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>


<script>

emailjs.init("YbQxsDAECBPjVui2A");


let order = JSON.parse(localStorage.getItem("order"));

let total = 0;


if(order){

    order.cart.forEach(item=>{

        total += item.price * (item.quantity || 1);

    });


  document.getElementById("cardTotal").innerHTML = "€" + total;

}



function completeCardPayment(){

let cardName = document.getElementById("cardName").value;
let cardNumber = document.getElementById("cardNumber").value;
let expiry = document.getElementById("expiry").value;
let cvv = document.getElementById("cvv").value;


if(
cardName !== "Emir Eren" ||
cardNumber !== "5301 5106 9200 1020" ||
expiry !== "03/28" ||
cvv !== "426"
){

alert("Invalid card details");
return;

}
  
localStorage.setItem(
"paymentStatus",
"Card Payment Completed"
);

let order = JSON.parse(localStorage.getItem("order"));

emailjs.send(
"service_jogh68a",
"template_timxinw",
{
  to_email: order.email,
  customer_name: order.name,
  order_total: total,
  customer_address: order.address,
  customer_phone: order.phone,
  payment_method: "Card Payment"
}
)
.then(function(response){

  console.log("Email sent successfully", response);

  alert("Payment Successful");

  window.location.href = "receipt.html";

})
.catch(function(error){

  console.log("Email error:", error);

  alert("Payment completed but email failed");

});

}



</script>


</body>

</html>
