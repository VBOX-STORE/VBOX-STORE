<!DOCTYPE html>
<html>
<head>
    <title>Order Successful</title>
    <link rel="stylesheet" href="css/style.css">

<style>

body{
font-family: Arial, sans-serif;
background:#f5f5f5;
}

.receipt-box{
background:white;
max-width:500px;
margin:40px auto;
padding:30px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,0.15);
}

h1{
text-align:center;
font-size:32px;
}

h2{
text-align:center;
}

hr{
margin:20px 0;
}

p{
font-size:22px;
line-height:1.6;
}

button{
background:black;
color:white;
border:none;
padding:15px 25px;
border-radius:8px;
font-size:16px;
cursor:pointer;
width:100%;
}

  @media print {

   @page {
    size: auto;
    margin: 15mm;
} 

body {
    background: white;
}

.receipt-box {
    width: 95%;
    max-width: 750px;
    margin: auto;
    padding: 35px;
    border: 1px solid #ddd;
    box-shadow: none;
}

button,
    .download-btn {
        display: none;
    }

h1 {
    font-size: 36px;
    text-align: center;
}

h2 {
    text-align: center;
    font-size: 28px;
}

p {
    font-size: 15px;
    margin: 8px 0;
}

h3 {
    font-size: 18px;
    margin-top: 15px;
}

hr {
    margin: 15px 0;
}

}

</style>
  
</head>

<body>

<div class="receipt-box">

<h1>VBOX Store</h1>

<h2>Payment Receipt</h2>

<hr>

<p>Receipt No: <b id="receiptNo"></b></p>

<p>Date: <b id="receiptDate"></b></p>

<hr>

<p>Customer Name: <b id="customerName"></b></p>

<p>Order Total: <b>€<span id="orderTotal"></span></b></p>

<h3>Items Purchased</h3><div id="receiptItems"></div>
  
<p>Payment Method: <b id="paymentMethod"></b></p>

<p>Delivery Address: <b id="customerAddress"></b></p>

<p>Phone: <b id="customerPhone"></b></p>

<hr>

<h3>Thank you for shopping with VBOX Store</h3>

<button onclick="window.location.href='receipt.html'">
Download Receipt
</button>

</div>



<script>

let order = JSON.parse(localStorage.getItem("order"));

if(order){

document.getElementById("customerName").innerHTML =
"Hello " + order.name;

document.getElementById("paymentMethod").innerHTML =
order.payment_method || "Card Payment";

document.getElementById("customerAddress").innerHTML =
order.address;

document.getElementById("customerPhone").innerHTML =
order.phone;

  document.getElementById("receiptNo").innerHTML =
"VBOX-" + Date.now();

document.getElementById("receiptDate").innerHTML =
new Date().toLocaleString();

let itemsHTML = "";

order.cart.forEach(item => {
itemsHTML += `
<p>
${item.name} x ${item.quantity || 1}
- €${item.price * (item.quantity || 1)}
</p>
`;
});

document.getElementById("receiptItems").innerHTML = itemsHTML;

let total = 0;

order.cart.forEach(item=>{
    total += item.price * (item.quantity || 1);
});

document.getElementById("orderTotal").innerHTML = total;

}


function goHome(){

window.location.href = "shop.html";

}

  function downloadReceipt(){

    document.querySelector("button").style.display = "none";

    setTimeout(function(){
        window.print();
        document.querySelector("button").style.display = "block";
    }, 500);

}

</script>


</body>
</html>
