<!DOCTYPE html>
<html>

<head>

<title>Track Your Order - VBOX</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>

<h1>Track Your Order</h1>

<p>Enter your VBOX order number</p>

<input 
id="orderNumber" 
placeholder="Example: VBOX-1001">


<button onclick="trackOrder()">
Track Order
</button>


<div id="result"></div>



<script type="module">

alert("Script is working");

import { db } from "./js/firebase.js";

import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


async function trackOrder(){

let orderNumber = document.getElementById("orderNumber").value.trim();

let result = document.getElementById("result");


if(orderNumber === ""){
result.innerHTML = "Enter your order number";
return;
}


const orderRef = doc(db, "orders", orderNumber);

const orderSnap = await getDoc(orderRef);

console.log("Firebase connected");


if(orderSnap.exists()){

let data = orderSnap.data();


result.innerHTML = `

<h3>Order Found ✅</h3>

<p><b>Order Number:</b> ${orderNumber}</p>

<p>🌍 <b>Destination:</b> ${data.country}</p>

<hr>

<p>✅ Order Confirmed</p>

<p>💳 Payment Received</p>

<p>📦 Processing at Warehouse</p>

<p>🚚 ${data.status}</p>

<p>📍 <b>Current Location:</b> ${data.location}</p>

<p>📅 <b>Estimated Delivery:</b> ${data.delivery}</p>

`;

}

else{

result.innerHTML = "Order not found ❌";

}


}

window.trackOrder = trackOrder;

</script>


</body>

</html>
